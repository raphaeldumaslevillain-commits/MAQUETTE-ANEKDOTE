name: Validate and publish Anekdote

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: anekdote-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Install build tools
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -r requirements.txt
      - name: Rebuild and validate every page
        run: |
          .venv/bin/python scripts/build.py
          .venv/bin/python scripts/check_site.py
          for file in js/*.js; do node --check "$file"; done
          node scripts/check_theme.cjs
      - name: Prepare public files
        run: .venv/bin/python scripts/package_pages.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
